<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif;">
        <p>Initializing Just It...</p>
      </div>
    </div>
    <script>
      console.log('HTML Script: starting...');
      window.onerror = function(msg, url, line, col, error) {
        console.error('Global Error:', msg, 'at', url, ':', line, ':', col, error);
        document.getElementById('root').innerHTML = '<div style="color:red; padding:20px;"><h1>Runtime Error</h1><p>' + msg + '</p></div>';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
